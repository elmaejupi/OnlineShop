<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Online Shop</title>
    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header class="h-24 flex items-center bg-orange-100">
        <div class="container mx-auto flex items-center justify-between">
            <span class="text-3xl text-gray-500"><i class="fa-solid fa-shop"></i> Online Shop</span>
            <nav>
                <ul class="flex items-center gap-4">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="cart.html">Cart</a></li>
                    <div class="auth flex items-center">
                        <a href="dashboard.html">Dashboard</a>
                        <a href="dashboard.html?action=logout" class="ml-4"><i class="fa-solid fa-right-from-bracket"></i></a>
                    </div>
                    <div class="guest flex items-center hidden">
                        <a href="register.html" class="hidden">Register</a>
                        <a href="login.html?action=login" class="hidden">Login</a>
                    </div>
                </ul>
            </nav>
        </div>
    </header>

    <section class="py-20">
        <div class="container mx-auto">
            <h2 class="text-3xl mb-6">Dashboard</h2>
            <div id="ordersContainer" class="mt-12"></div>
        </div>
    </section>

    <footer class="bg-orange-100">
        <div class="container mx-auto h-16 flex justify-between items-center">
            <p>Copyrights &copy; Online Shop, 2024</p>
            <p>Developer PP Team</p>
        </div>
    </footer>

    <script type="module">
        import { authLinks, renderOrders, initCancelButtons } from "./modules/App.js";

        const isloggedin = localStorage.getItem('isloggedin') === 'true';
        const params = new URLSearchParams(window.location.search);
        const action = params.get('action');

        if (action === 'logout') {
            localStorage.removeItem('isloggedin');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 100);
        }

        if (!isloggedin) {
            window.location.href = 'index.html';
        }

        window.onload = () => {
            authLinks(isloggedin);
            const orders = JSON.parse(localStorage.getItem('orders')) || [];
            document.querySelector('#ordersContainer').innerHTML = renderOrders(orders);
            initCancelButtons();
        };
    </script>
</body>
</html>
