<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Online Shop</title>
    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header class="h-24 mx-auto flex items-center bg-orange-100">
        <div class="container mx-6 flex items-center justify-between">
            <span class="text-3xl text-slate-900"><i class="fa-solid fa-shop"></i>Online Shop</span>
            <nav>
                <ul class="flex items-center gap-4">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="cart.html">Cart (0)</a></li>
                    <div class="auth flex items-center gap-4">
                        <li><a href="dashboard.html">Dashboard</a></li>
                        <li><a href="dashboard.html?action=logout"><i class="fa-solid fa-right-from-bracket"></i></a></li>
                    </div>
                    <div class="guest flex items-center gap-4">
                        <li><a href="register.html">Register</a></li>
                        <li><a href="login.html">Login</a></li>
                    </div>
                </ul>
            </nav>
        </div>
    </header>

    <section class="py-20">
        <div class="container mx-auto">
            <div class="flex justify-between items-center">
                <div class="w-[500px]">
                    <input id="search-input" type="search" placeholder="Search by title" class="w-[400px] border border-gray-300 px-6 py-2 mr-3">
                    <a href="shop.html" class="underline">Clear</a>
                </div>
                <div class="w-1/3 flex justify-center items-center">
                    <button class="text-white bg-gray-600 px-2 py-1" id="prev-btn">Prev</button>
                    <p class="mx-4" id="page"></p>
                    <button class="text-white bg-gray-600 px-2 py-1" id="next-btn">Next</button>
                </div>
            </div>
            <div id="all_products" class="grid grid-cols-4 gap-6 my-12"></div>
        </div>
    </section>

    <footer class="bg-orange-100">
        <div class="container mx-auto h-16 flex justify-between items-center">
            <p>Copyrights &copy; Online Shop, 2024</p>
            <p>Developer PP Team</p>
        </div>
    </footer>

    <script type="module">
        import {authLinks} from "./modules/App.js"
        const isloggedin = localStorage.getItem('isloggedin') ?? false
        const all_products = document.querySelector('#all_products')

        let products = []  
        let filteredProducts = []  
        let page = 1
        const productsPerPage = 8
        const page_div = document.querySelector('#page')
        page_div.innerHTML = page
        const prev_btn = document.querySelector('#prev-btn')
        const next_btn = document.querySelector('#next-btn')
        const searchInput = document.querySelector('#search-input')

        authLinks(isloggedin)
        fetchAllProducts()

        prev_btn.addEventListener('click', () => {
            if(page > 1) {
                page--
                displayProductsForPage(page)
            }
        })

        next_btn.addEventListener('click', () => {
            const totalPages = Math.ceil(filteredProducts.length / productsPerPage)
            if(page < totalPages) {
                page++
                displayProductsForPage(page)
            }
        })

        searchInput.addEventListener('keyup', () => {
            const searchTerm = searchInput.value.toLowerCase().trim()
            
            if (searchTerm === '') {
                filteredProducts = products
            } else {
                filteredProducts = products.filter(product =>
                    product.title.toLowerCase().includes(searchTerm)
                )
            }

            page = 1
            displayProductsForPage(page)
        })

        function fetchAllProducts() {
            fetch('https://fakestoreapi.com/products')
            .then(resp => resp.json())
            .then(resp => {
                products = resp 
                filteredProducts = products 
                displayProductsForPage(page)
            })
        }

        function displayProductsForPage(page) {
            let products_html = ''
            const start = (page - 1) * productsPerPage
            const end = start + productsPerPage
            const productsToShow = filteredProducts.slice(start, end)

            productsToShow.forEach(product => {
                products_html += `
                    <div class="border border-gray-200 rounded-md p-4">
                        <div class="w-52 h-52 overflow-y-hidden">
                            <img src="${product.image}" alt="${product.title}" class="w-52 h-52 overflow-hidden flex justify-center items-center">
                        </div>
                        <div class="flex items-center justify-between">
                            <h3 class="text-lg font-semibold text-center mb-1">${product.title}</h3>
                            <p class="text-red-500 font-bold mb-2">$${product.price}</p>
                            <a href="products.html?id=${product.id}" class="w-[50px] text-center py-2 text-gray-200 border border-gray-200 hover:border-red-200 hover:text-red-400 font-semibold"><i class="fa-solid fa-arrow-right"></i></a>
                        </div>
                    </div>
                `
            })

            all_products.innerHTML = products_html
            page_div.innerHTML = page
        }
    </script>
</body>
</html>
